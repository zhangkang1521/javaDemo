<!DOCTYPE html>
<html>
<head>
    <title>Welcome to WebSocket Echo Server!</title>
    <style>
        body {
            width: 35em;
            margin: 0 auto;
            font-family: Tahoma, Verdana, Arial, sans-serif;
        }

    </style>
</head>
<body>
<h1>WebSocket Echo Server!</h1>
<form onsubmit="return false;">
    <input type="text" name="message" placeholder="请输入发送内容"/>
    <input type="button" value="通过WebSocket发送" onclick="send(this.form.message.value)"/>
    <h3>Output</h3>
    <textarea id="responseText" style="width:500px;height:300px;"></textarea>
</form>
</body>
<script type="text/javascript">
//建立WebSocket连接
var socket = new WebSocket("ws://localhost:9999/ws","echo");
// 接收消息事件
socket.onmessage = function (event) {
	var ta = document.getElementById('responseText');
	ta.value = ta.value + '\n' + event.data
};
 //连接打开事件
socket.onopen = function (event) {
	var target = document.getElementById('responseText');
	target.value = "Web Socket 连接已经开启!";
};
//连接关闭事件
socket.onclose = function (event) {
	var target = document.getElementById('responseText');
	target.value = target.value + "Web Socket 连接已经断开";
};

//发送WebSocket消息
function send(message) {
	if (socket.readyState == WebSocket.OPEN) {
		//发送消息
		socket.send(message);
	} else {
		alert("The socket is not open.");
	}
}
</script>
</html>
